<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador — Expedientes Clínicos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="topbar">
  <div class="container">
    <div class="topbar-brand">
      <div class="topbar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>Expedientes Clínicos</h1>
      <span class="role-tag">ADMINISTRADOR</span>
    </div>
    <div class="topbar-user">
      <button class="topbar-logout" onclick="auth.logout()">Cerrar sesión</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="container">

    <div class="tabs" id="adminTabs">
      <button class="tab active" data-tab="tabPacientes">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        Pacientes
      </button>
      <button class="tab" data-tab="tabUsuarios">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Usuarios
      </button>
      <button class="tab" data-tab="tabAuditoria">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Auditoría
      </button>
    </div>

    <!-- TAB 1: Pacientes -->
    <div class="tab-content active" id="tabPacientes">
      <div id="panelPacientes">
        <div class="card"><div class="card-body">
          <div class="empty-state" style="padding:3rem 2rem;">
            <span class="spinner"></span>
            <p style="margin-top:1rem;">Cargando pacientes...</p>
          </div>
        </div></div>
      </div>
    </div>

    <!-- TAB 2: Usuarios -->
    <div class="tab-content" id="tabUsuarios">
      <div id="panelUsuarios">
        <div class="card"><div class="card-body">
          <div class="empty-state" style="padding:3rem 2rem;">
            <div class="empty-icon">
              <svg width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <p>Selecciona la pestaña para cargar los usuarios</p>
          </div>
        </div></div>
      </div>
    </div>

    <!-- TAB 3: Auditoría -->
    <div class="tab-content" id="tabAuditoria">
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <h2>Registros de Auditoría</h2>
            <span id="countAuditoria" style="font-size:0.8rem;color:#94A3B8;"></span>
          </div>
          <div style="display:flex;gap:0.625rem;align-items:center;">
            <button type="button" class="filter-reset" id="btnLimpiarAuditoria">Limpiar filtros</button>
            <button class="btn btn-primary btn-sm" id="btnBuscarAuditoria">Buscar</button>
          </div>
        </div>
        <div class="card-body" style="padding-bottom:0;">
          <div class="filters">
            <div class="form-group">
              <label for="aIdUsuario">ID usuario</label>
              <input type="number" id="aIdUsuario" placeholder="Todos" min="1" style="width:110px;" />
            </div>
            <div class="form-group">
              <label for="aFechaDesde">Desde</label>
              <input type="datetime-local" id="aFechaDesde" />
            </div>
            <div class="form-group">
              <label for="aFechaHasta">Hasta</label>
              <input type="datetime-local" id="aFechaHasta" />
            </div>
            <div class="form-group">
              <label for="aAccion">Acción</label>
              <select id="aAccion" style="min-width:190px;">
                <option value="">Todas</option>
                <option>CONSULTAR_EXPEDIENTE</option>
                <option>MODIFICAR_EXPEDIENTE</option>
                <option>CAMBIAR_ESTADO_EXPEDIENTE</option>
                <option>REGISTRAR_ENTREVISTA</option>
                <option>REGISTRAR_CONSENTIMIENTO</option>
                <option>REGISTRAR_REPORTE</option>
                <option>MODIFICAR_REPORTE</option>
                <option>ENVIAR_REPORTE</option>
                <option>APROBAR_REPORTE</option>
                <option>RECHAZAR_REPORTE</option>
              </select>
            </div>
            <div class="form-group">
              <label for="aRecurso">Recurso</label>
              <input type="text" id="aRecurso" placeholder="Ej. Expediente" style="width:140px;" />
            </div>
            <div class="form-group">
              <label for="aResultado">Resultado</label>
              <select id="aResultado" style="min-width:120px;">
                <option value="">Todos</option>
                <option>PERMITIDO</option>
                <option>DENEGADO</option>
              </select>
            </div>
          </div>
        </div>
        <div id="auditoriaResultado">
          <div class="empty-state" style="padding:2.5rem 2rem;">
            <div class="empty-icon">
              <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/>
              </svg>
            </div>
            <p>Aplica filtros y presiona <strong>Buscar</strong> para ver los registros</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
auth.guard();
</script>
<script src="js/administrador.js"></script>
<script>
/* Limpiar filtros de auditoría */
(function () {
  document.getElementById('btnLimpiarAuditoria').addEventListener('click', function () {
    ['aIdUsuario', 'aFechaDesde', 'aFechaHasta', 'aRecurso'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('aAccion').value   = '';
    document.getElementById('aResultado').value = '';
    var countEl = document.getElementById('countAuditoria');
    if (countEl) countEl.textContent = '';
    document.getElementById('auditoriaResultado').innerHTML =
      '<div class="empty-state" style="padding:2.5rem 2rem;">' +
      '<div class="empty-icon"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">' +
      '<line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/>' +
      '</svg></div><p>Aplica filtros y presiona <strong>Buscar</strong> para ver los registros</p></div>';
  });
})();
</script>
</body>
</html>
