<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervisor — Expedientes Clínicos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="topbar">
  <div class="container">
    <div class="topbar-brand">
      <div class="topbar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>Expedientes Clínicos</h1>
      <span class="role-tag">SUPERVISOR</span>
    </div>
    <div class="topbar-user">
      <button class="topbar-logout" onclick="auth.logout()">Cerrar sesión</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="container">

    <div id="contentPanel">
      <div class="card">
        <div class="card-body">
          <div class="empty-state" style="padding:3rem 2rem;">
            <div class="empty-icon">
              <svg width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"/>
                <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
              </svg>
            </div>
            <p>Cargando reportes pendientes...</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal: Confirmar aprobación -->
<div class="modal-overlay modal-sm" id="modalAprobar">
  <div class="modal">
    <div class="modal-header">
      <h3>Aprobar Reporte</h3>
      <button class="btn-close" onclick="closeModal('modalAprobar')" aria-label="Cerrar">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p id="confirmAprobarMsg" style="font-size:0.9375rem;color:#1E293B;margin-bottom:1rem;font-weight:500;"></p>
      <div class="alert alert-info" style="margin:0;">Una vez aprobado, el terapeuta no podrá modificar este reporte.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalAprobar')">Cancelar</button>
      <button class="btn btn-success" id="btnConfirmarAprobar">Confirmar aprobación</button>
    </div>
  </div>
</div>

<!-- Modal: Rechazar reporte -->
<div class="modal-overlay" id="modalRechazar">
  <div class="modal">
    <div class="modal-header">
      <h3>Rechazar Reporte</h3>
      <button class="btn-close" onclick="closeModal('modalRechazar')" aria-label="Cerrar">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div class="alert alert-info" style="margin-bottom:1rem;">
        Indica los motivos del rechazo para que el terapeuta pueda corregir el reporte.
      </div>
      <div class="form-group">
        <label for="comentariosRechazo">Retroalimentación al terapeuta <span class="req">*</span></label>
        <textarea id="comentariosRechazo" rows="5" required
          placeholder="Describe qué debe corregirse en el reporte..."></textarea>
        <div class="char-count" id="cuentaRechazo">0 caracteres</div>
      </div>
    </div>
    <div class="modal-footer">
      <div id="mslRechazar" class="modal-status-line"></div>
      <button class="btn btn-secondary" onclick="closeModal('modalRechazar')">Cancelar</button>
      <button class="btn btn-danger" id="btnConfirmarRechazo">Confirmar rechazo</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
auth.guard();
</script>
<script src="js/supervisor.js"></script>
<script>
/* Confirmación antes de aprobar (intercepta en fase de captura) */
(function () {
  var idAprobarPendiente = null;

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('#btnAprobar');
    if (!btn) return;
    e.stopImmediatePropagation();

    var onclick = btn.getAttribute('onclick') || '';
    var match   = onclick.match(/\d+/);
    if (!match) return;
    idAprobarPendiente = parseInt(match[0], 10);

    document.getElementById('confirmAprobarMsg').textContent =
      '¿Confirmar aprobación del reporte #' + idAprobarPendiente + '? Esta acción no se puede deshacer.';
    openModal('modalAprobar');
  }, true);

  document.getElementById('btnConfirmarAprobar').addEventListener('click', function () {
    closeModal('modalAprobar');
    if (idAprobarPendiente != null) {
      aprobarReporte(idAprobarPendiente);
      idAprobarPendiente = null;
    }
  });
})();

/* Contador de caracteres para retroalimentación de rechazo */
(function () {
  var ta      = document.getElementById('comentariosRechazo');
  var counter = document.getElementById('cuentaRechazo');
  function update() {
    var n = ta.value.length;
    counter.textContent = n + ' caracter' + (n === 1 ? '' : 'es');
    counter.style.color = n === 0 ? '#DC2626' : n < 15 ? '#D97706' : '#94A3B8';
  }
  ta.addEventListener('input', update);
  document.getElementById('modalRechazar').addEventListener('transitionend', update);
  update();
})();
</script>
</body>
</html>
