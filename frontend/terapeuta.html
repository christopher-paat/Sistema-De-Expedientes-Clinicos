<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terapeuta — Expedientes Clínicos</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
</head>
<body>

<div class="topbar">
  <div class="container">
    <div class="topbar-brand">
      <div class="topbar-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>Expedientes Clínicos</h1>
      <span class="role-tag">TERAPEUTA</span>
    </div>
    <div class="topbar-user">
      <button class="topbar-logout" onclick="auth.logout()">Cerrar sesión</button>
    </div>
  </div>
</div>

<div class="page">
  <div class="container">

    <div id="contentPanel">
      <div class="card"><div class="card-body"><div class="empty-state">
        <span class="spinner"></span>
        <p style="margin-top:1rem;">Cargando pacientes...</p>
      </div></div></div>
    </div>

  </div>
</div>

<!-- Modal: Nuevo / Modificar Reporte -->
<div class="modal-overlay" id="modalReporte">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalReporteTitulo">Nuevo Reporte de Sesión</h3>
      <button class="btn-close" onclick="closeModal('modalReporte')" aria-label="Cerrar">&#x2715;</button>
    </div>
    <div class="modal-body">
      <form id="formReporte" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="rfFechaSesion">Fecha de sesión <span class="req">*</span></label>
            <input type="text" id="rfFechaSesion" placeholder="Seleccionar fecha..." readonly required />
          </div>
          <div class="form-group">
            <label for="rfDuracion">Duración (minutos) <span class="req">*</span></label>
            <input type="number" id="rfDuracion" min="1" max="480" placeholder="Ej. 60" required />
          </div>
        </div>
        <div class="form-group">
          <label for="rfObservaciones">Observaciones clínicas <span class="req">*</span></label>
          <textarea id="rfObservaciones" rows="5" maxlength="2000"
            placeholder="Describe el desarrollo de la sesión, avances, dificultades y objetivos trabajados..."
            required></textarea>
        </div>
        <div class="form-group">
          <label for="rfComentarios">Comentarios del terapeuta</label>
          <textarea id="rfComentarios" rows="3" maxlength="1000" placeholder="Notas adicionales, recomendaciones o seguimiento..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <div id="mslReporte" class="modal-status-line"></div>
      <button class="btn btn-secondary" onclick="closeModal('modalReporte')">Cancelar</button>
      <button class="btn btn-primary" id="btnGuardarReporte">Guardar Reporte</button>
    </div>
  </div>
</div>

<!-- Modal: Ver Documento -->
<div class="modal-overlay" id="modalVerDocumento">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalVerDocTitulo"></h3>
      <button class="btn-close" onclick="closeModal('modalVerDocumento')" aria-label="Cerrar">&#x2715;</button>
    </div>
    <div class="modal-body">
      <div id="modalVerDocCuerpo"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modalVerDocumento')">Cerrar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
auth.guard();
</script>
<script src="js/terapeuta.js"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
<script>
(function () {
  flatpickr.localize(flatpickr.l10ns.es);
  flatpickr('#rfFechaSesion', {
    locale: 'es',
    dateFormat: 'Y-m-d',
    altInput: true,
    altFormat: 'd/m/Y',
    allowInput: false,
    animate: true,
    static: false,
    disableMobile: true,
  });
})();
</script>
</body>
</html>
