<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — Expedientes Clínicos</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>
<body class="login-body">

<div class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <div class="login-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="login-clinic-name">Clínica Psicológica</div>
        <div class="login-system-name">Sistema de Expedientes Clínicos</div>
      </div>
    </div>

    <div class="login-divider"></div>

    <div class="login-body-inner">
      <h2 class="login-title">Ingresar al módulo de expedientes clínicos</h2>
      <p class="login-subtitle">Ingresa tu ID de usuario para acceder a tu módulo de trabajo.</p>

      <form id="loginForm" novalidate>
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="loginId">ID de usuario</label>
          <input
            type="number"
            id="loginId"
            placeholder="Ej. 3"
            min="1"
            autocomplete="off"
            autofocus
            required
          />
          <div class="form-hint">El sistema identificará tu módulo automáticamente.</div>
        </div>

        <div id="loginError" class="alert alert-error hidden" role="alert"></div>

        <button type="submit" class="btn btn-primary login-btn" id="btnLogin">
          Ingresar al módulo de expedientes clínicos
        </button>
      </form>
    </div>

    <div class="login-footer">
      <div class="login-role-icons">
        <div class="login-role-chip">
          <span class="login-role-dot login-role-dot-blue"></span>Terapeuta
        </div>
        <div class="login-role-chip">
          <span class="login-role-dot login-role-dot-teal"></span>Supervisor
        </div>
        <div class="login-role-chip">
          <span class="login-role-dot login-role-dot-violet"></span>Administrador
        </div>
      </div>
    </div>

  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
